<main class="recovery-page"><section class="recovery-card" *ngIf="!success"><a routerLink="/auth/login">← Back to sign in</a><span class="eyebrow">SECURE PASSWORD RESET</span><h1>Create a new password</h1><p>Your new password must contain at least 8 characters.</p><form (ngSubmit)="submit()" #f="ngForm"><label>New password<input type="password" [(ngModel)]="password" name="password" required minlength="8"></label><label>Confirm password<input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required></label><p class="error" *ngIf="password&&confirmPassword&&password!==confirmPassword">Passwords do not match.</p><p class="error" *ngIf="error">{{error}}</p><button [disabled]="f.invalid||password!==confirmPassword||loading||!token">{{loading?'Resetting...':'Reset password'}}</button></form></section><section class="recovery-card success" *ngIf="success"><span class="eyebrow">PASSWORD UPDATED</span><h1>You are all set</h1><p>Your password was changed successfully. Please sign in with your new password.</p><button (click)="login()">Sign in</button></section></main>
