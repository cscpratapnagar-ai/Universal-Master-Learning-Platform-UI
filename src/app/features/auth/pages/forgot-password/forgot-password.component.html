<main class="recovery-page" [class.light-mode]="theme==='light'"><section class="recovery-card" *ngIf="!sent"><a routerLink="/auth/login">← Back to sign in</a><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Reset your password</h1><p>Enter your email and we will create secure reset instructions for your account.</p><form (ngSubmit)="submit()" #f="ngForm"><label>Email address<input type="email" [(ngModel)]="email" name="email" required email placeholder="you@example.com"></label><p class="error" *ngIf="error">{{error}}</p><button [disabled]="f.invalid||loading">{{loading?'Processing...':'Continue'}}</button></form></section><section class="recovery-card success" *ngIf="sent"><span class="eyebrow">REQUEST RECEIVED</span><h1>Check your inbox</h1><p>If an account exists for <strong>{{email}}</strong>, password reset instructions will be sent securely.</p><button (click)="goLogin()">Back to sign in</button></section></main>
