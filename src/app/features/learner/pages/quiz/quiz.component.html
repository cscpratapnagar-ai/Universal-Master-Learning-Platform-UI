<main class="quiz"><header><span>KNOWLEDGE CHECK</span><h1>Assessment</h1><p>Select the best answer for each question.</p></header><section class="question" *ngFor="let q of questions;let i=index"><div class="num">{{i+1}}</div><h2>{{q.questionText}}</h2><button *ngFor="let o of q.options" [class.selected]="answers[q.id]===o.id" (click)="select(q.id,o.id)">{{o.optionText}}</button></section><p class="error" *ngIf="error">{{error}}</p><button class="submit" (click)="submit()" [disabled]="submitting">{{submitting?'Submitting...':'Submit Assessment →'}}</button></main>
