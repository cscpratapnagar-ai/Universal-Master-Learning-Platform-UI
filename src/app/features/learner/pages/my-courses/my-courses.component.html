<section class="page"><div class="hero"><span>MY LEARNING</span><h1>Your learning journey</h1><p>Continue exactly where you left off.</p></div><p *ngIf="loading">Loading your courses...</p><p class="error" *ngIf="error">{{error}}</p><div class="grid" *ngIf="!loading"><article class="course" *ngFor="let c of courses"><div class="top"><span class="badge">{{c.status}}</span><span>{{c.progressPercent}}%</span></div><h2>{{c.title}}</h2><p>{{c.description}}</p><div class="progress"><span [style.width.%]="c.progressPercent"></span></div><button (click)="open(c)">{{c.progressPercent>0?'Continue Learning':'Start Learning'}} →</button></article><div class="empty" *ngIf="courses.length===0">No enrolled courses yet.</div></div></section>
