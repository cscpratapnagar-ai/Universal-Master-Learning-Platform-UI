<main class="result"><div class="card" *ngIf="result"><div class="icon">{{result.passed?'🏆':'📚'}}</div><span>ASSESSMENT RESULT</span><h1>{{result.passed?'Congratulations!':'Keep Learning'}}</h1><div class="score">{{result.score}}%</div><p>{{result.correctAnswers}} correct out of {{result.totalQuestions}} questions</p><div class="status" [class.pass]="result.passed">{{result.passed?'PASSED':'NOT PASSED'}}</div><button (click)="back()">Back to Learning</button></div></main>
