<section class="player" *ngIf="data"><header><button (click)="back()">← Back</button><div><span>LEARNING PLAYER</span><h1>{{data.title}}</h1></div><strong>{{data.progressPercent}}% Complete</strong></header><div class="layout"><aside><div class="module" *ngFor="let m of data.modules"><h3>{{m.title}}</h3><button *ngFor="let l of m.lessons" [class.active]="selected?.id===l.id" (click)="select(l)"><span>{{l.completed?'✓':'○'}}</span>{{l.title}}</button></div></aside><main *ngIf="selected"><div class="type">{{selected.contentType}}</div><h2>{{selected.title}}</h2><div class="content">{{selected.content || 'Lesson content will appear here.'}}</div><button class="complete" [disabled]="selected.completed" (click)="complete()">{{selected.completed?'Completed ✓':'Mark lesson complete'}}</button></main></div></section><p *ngIf="loading" class="loading">Loading course...</p>
