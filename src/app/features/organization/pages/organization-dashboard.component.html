<main class="org-shell"><header><p>ORGANIZATION ADMIN</p><h1>Institute Command Center</h1><span>Manage identity, contact, branding and lifecycle.</span></header><section class="lookup"><input [formControl]="form.controls.organizationId" placeholder="Organization UUID"><button (click)="load()">Load</button></section><p class="error" *ngIf="error">{{error}}</p><p class="success" *ngIf="success">{{success}}</p><section *ngIf="profile" class="grid"><aside class="card"><span class="badge">{{profile.status}}</span><h2>{{profile.displayName||profile.name}}</h2><p>{{profile.code}}</p><div *ngFor="let s of statuses"><button (click)="changeStatus(s)" [disabled]="s===profile.status">{{s}}</button></div></aside><form class="card" [formGroup]="form" (ngSubmit)="save()"><h2>Organization Profile</h2><div class="fields"><label>Slug<input formControlName="slug"></label><label>Legal Name<input formControlName="legalName"></label><label>Display Name<input formControlName="displayName"></label><label>Type<input formControlName="organizationType"></label><label>Email<input formControlName="primaryEmail"></label><label>Phone<input formControlName="primaryPhone"></label><label>Website<input formControlName="website"></label><label>Country<input formControlName="country"></label><label>State<input formControlName="state"></label><label>City<input formControlName="city"></label><label>Logo URL<input formControlName="logoUrl"></label><label>Primary Color<input formControlName="primaryColor"></label></div><button class="save" [disabled]="saving">{{saving?'Saving...':'Save Profile'}}</button></form></section></main>
